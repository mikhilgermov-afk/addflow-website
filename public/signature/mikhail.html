<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AddFlow email signature - Mikhail Gerasimov</title>
</head>
<body style="margin:0;padding:40px;background:#f3f4f6;">
  <div style="width:560px;max-width:100%;margin:0 0 14px;font-family:Arial,Helvetica,sans-serif;">
    <button id="copy-signature" type="button" onclick="copySignature()" style="height:40px;padding:0 18px;border:0;background:#b7ff39;color:#0b0d0a;font-family:Consolas,'Courier New',monospace;font-size:10px;font-weight:800;letter-spacing:.7px;cursor:pointer;">СКОПИРОВАТЬ ПОДПИСЬ</button>
    <span style="padding-left:10px;color:#68707c;font-size:11px;">В Roundcube должен быть включён HTML-режим</span>
  </div>

  <table id="addflow-signature" role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" bgcolor="#080a0f" style="width:560px;max-width:100%;border-collapse:collapse;background:#080a0f;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <tr>
      <td width="126" valign="middle" align="center" bgcolor="#080a0f" style="width:126px;padding:18px 16px;background:#080a0f;border-right:1px solid #272c35;">
        <a href="https://add-flow.ru" target="_blank" style="text-decoration:none;">
          <img src="https://add-flow.ru/addflow-logo-original.png" width="92" height="92" alt="AddFlow" style="display:block;width:92px;height:92px;margin:0 auto;border:0;">
        </a>
      </td>
      <td valign="middle" bgcolor="#080a0f" style="padding:18px 22px;background:#080a0f;">
        <div style="margin:0;color:#ffffff;font-size:24px;line-height:28px;font-weight:800;letter-spacing:-.5px;">Mikhail Gerasimov</div>
        <div style="margin:4px 0 0;color:#b7ff39;font-family:Consolas,'Courier New',monospace;font-size:10px;line-height:14px;font-weight:800;letter-spacing:1px;">CEO / ADDFLOW</div>
        <div style="margin:7px 0 0;color:#a6adb8;font-size:11px;line-height:16px;">Native advertising for live streaming</div>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:13px;border-collapse:collapse;">
          <tr>
            <td bgcolor="#b7ff39" style="background:#b7ff39;">
              <a href="mailto:gerasimov@add-flow.ru" style="display:block;padding:9px 12px;color:#080a0f;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:14px;font-weight:800;">EMAIL&nbsp;&nbsp; gerasimov@add-flow.ru</a>
            </td>
            <td width="8" style="width:8px;font-size:0;line-height:0;">&nbsp;</td>
            <td bgcolor="#7d52ff" style="background:#7d52ff;">
              <a href="https://add-flow.ru" target="_blank" style="display:block;padding:9px 12px;color:#ffffff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:14px;font-weight:800;">WEBSITE&nbsp; &#8599;</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td colspan="2" bgcolor="#080a0f" style="padding:0;background:#080a0f;font-size:0;line-height:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
          <tr>
            <td width="25%" height="4" bgcolor="#35d9ff" style="width:25%;height:4px;background:#35d9ff;">&nbsp;</td>
            <td width="25%" height="4" bgcolor="#7d52ff" style="width:25%;height:4px;background:#7d52ff;">&nbsp;</td>
            <td width="25%" height="4" bgcolor="#ff3cac" style="width:25%;height:4px;background:#ff3cac;">&nbsp;</td>
            <td width="25%" height="4" bgcolor="#b7ff39" style="width:25%;height:4px;background:#b7ff39;">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <script>
    function copySignature() {
      const signature = document.getElementById("addflow-signature");
      const button = document.getElementById("copy-signature");
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNode(signature);
      selection.removeAllRanges();
      selection.addRange(range);

      try {
        const copied = document.execCommand("copy");
        if (!copied) {
          throw new Error("Copy command was rejected");
        }
        selection.removeAllRanges();
        button.textContent = "СКОПИРОВАНО";
      } catch (_error) {
        button.textContent = "НАЖМИТЕ CTRL+C";
      }

      setTimeout(() => {
        button.textContent = "СКОПИРОВАТЬ ПОДПИСЬ";
      }, 3500);
    }
  </script>
</body>
</html>
